<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  body { display:flex; justify-content:center; align-items:center; height:100vh; margin:0; background:#222; font-family:Arial, sans-serif; }
  .calc { background:#333; padding:20px; border-radius:12px; width:260px; }
  #display { width:100%; height:50px; font-size:24px; text-align:right; margin-bottom:12px; padding:0 10px; box-sizing:border-box; border:none; border-radius:6px; }
  .buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  button { height:50px; font-size:20px; border:none; border-radius:6px; cursor:pointer; background:#555; color:#fff; }
  button:hover { background:#666; }
  .op { background:#f39c12; }
  .eq { background:#27ae60; }
  .clear { background:#c0392b; }
</style>
</head>
<body>
<div class="calc">
  <input type="text" id="display" readonly>
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="del()">⌫</button>
    <button class="op" onclick="append('%')">%</button>
    <button class="op" onclick="append('/')">÷</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="op" onclick="append('*')">×</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="op" onclick="append('-')">−</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="op" onclick="append('+')">+</button>

    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button class="eq" onclick="calculate()" style="grid-column: span 2;">=</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');

  function append(value) {
    display.value += value;
  }

  function clearDisplay() {
    display.value = '';
  }

  function del() {
    display.value = display.value.slice(0, -1);
  }

  function calculate() {
    try {
      // kan9bel ghir arqam w operateurs bach n7ماو l'input
      if (!/^[0-9+\-*/%.\s]+$/.test(display.value)) {
        display.value = 'Error';
        return;
      }
      display.value = Function('"use strict"; return (' + display.value + ')')();
    } catch (e) {
      display.value = 'Error';
    }
  }

  // Support dyal clavier
  document.addEventListener('keydown', (e) => {
    if ('0123456789+-*/.%'.includes(e.key)) append(e.key);
    else if (e.key === 'Enter') calculate();
    else if (e.key === 'Backspace') del();
    else if (e.key === 'Escape') clearDisplay();
  });
</script>
</body>
</html>
